<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # CORS headers pour l'ensemble du site
        <IfModule mod_headers.c>
            Header set Access-Control-Allow-Origin "https://social8connect.netlify.app"
            Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
            Header set Access-Control-Allow-Headers "Content-Type, Authorization, X-CSRF-Token"
            Header set Access-Control-Allow-Credentials "true"
        </IfModule>
    </Directory>

    # Configuration spécifique pour le dossier uploads
    <Directory /var/www/html/uploads>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # Assurer que les fichiers statiques sont servis correctement
        <IfModule mod_headers.c>
            Header set Access-Control-Allow-Origin "https://social8connect.netlify.app"
            Header set Access-Control-Allow-Methods "GET, OPTIONS"
            Header set Access-Control-Allow-Headers "Content-Type, Authorization"
            Header set Access-Control-Allow-Credentials "true"
        </IfModule>

        # Désactiver l'exécution de scripts PHP dans uploads
        <IfModule mod_php.c>
            php_flag engine off
        </IfModule>
        RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .phps
    </Directory>

    # Gérer les requêtes OPTIONS pour CORS
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} OPTIONS
        RewriteRule ^(.*)$ $1 [R=200,L]
    </IfModule>
</VirtualHost>