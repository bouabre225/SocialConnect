<div class="notification-container">
        <div class="notification-header">
            <h1>Notifications</h1>
            <div>
                <button id="mark-all-read" class="btn">Tout marquer comme lu</button>
            </div>
        </div>
        
        <div class="notification-tabs">
            <div class="notification-tab active" data-tab="all">Toutes</div>
            <div class="notification-tab" data-tab="unread">Non lues</div>
        </div>
        
        <div class="notification-list" id="notification-list">
            <!-- Les notifications seront chargées ici via JavaScript -->
            <div class="notification-empty">
                <i class="far fa-bell"></i>
                <p>Aucune notification pour le moment</p>
            </div>
        </div>
    </div>
</div>
