<div class="container-fluid">
    <div class="row">
        <!-- Liste des conversations -->
        <div class="col-md-4 col-lg-3 d-none d-md-block border-end">
            <div class="chat-sidebar p-3">
                <h3 class="mb-3">Conversations</h3>
                <div class="conversations-list"></div>
            </div>
        </div>
        <!-- Zone de messages -->
        <div class="col-md-8 col-lg-9">
            <div class="chat-main p-3">
                <div class="chat-header d-flex align-items-center border-bottom p-2">
                    <h4 id="chat-title">Sélectionnez une conversation</h4>
                </div>
                <div class="messages-list" style="height: 70vh; overflow-y: auto;"></div>
                <form class="message-form mt-3 d-flex gap-2">
                    <input type="text" class="form-control" id="message-input" placeholder="Écrire un message...">
                    <button type="submit" class="btn btn-primary">Envoyer</button>
                </form>
            </div>
        </div>
    </div>
</div>
