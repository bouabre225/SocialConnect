<!-- Header -->
<header class="header">
    <div class="header-content">
        <a href="#" class="app-logo">
            <i class="fas fa-comment-dots"></i>
            <span>Social Connect</span>
        </a>
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="search-input" placeholder="Rechercher une conversation...">
        </div>
        <div class="nav-icons">
            <div class="nav-icon hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
            <div class="nav-icon" id="notifications-btn">
                <i class="fas fa-bell"></i>
                <span class="badge">3</span>
            </div>
            <div class="nav-icon" id="settings-btn">
                <i class="fas fa-cog"></i>
            </div>
            <div class="profile-icon">
                <img src="https://i.pravatar.cc/40?img=5" alt="Profile">
            </div>
        </div>
    </div>
</header>

<!-- Settings Panel -->
<div class="settings-panel" id="settings-panel">
    <div class="settings-header">
        <div class="settings-title">Paramètres</div>
        <button class="settings-close" id="settings-close">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <div class="settings-group">
        <div class="settings-group-title">
            <i class="fas fa-moon"></i>
            <span>Apparence</span>
        </div>
        <div class="settings-option">
            <label class="settings-label">Mode sombre</label>
            <label class="settings-switch">
                <input type="checkbox" id="dark-mode-toggle">
                <span class="settings-slider"></span>
            </label>
        </div>
        <div class="settings-option">
            <label class="settings-label">Taille de police</label>
            <select class="settings-select" id="font-size-select">
                <option value="small">Petite</option>
                <option value="medium" selected>Moyenne</option>
                <option value="large">Grande</option>
            </select>
        </div>
    </div>
    
    <div class="divider"></div>
    
    <div class="settings-group">
        <div class="settings-group-title">
            <i class="fas fa-comment-alt"></i>
            <span>Messages</span>
        </div>
        <div class="settings-option">
            <label class="settings-label">Messages éphémères</label>
            <label class="settings-switch">
                <input type="checkbox" id="ephemeral-toggle">
                <span class="settings-slider"></span>
            </label>
        </div>
        <div class="settings-option">
            <label class="settings-label">Confirmation de lecture</label>
            <label class="settings-switch">
                <input type="checkbox" id="read-receipts-toggle" checked>
                <span class="settings-slider"></span>
            </label>
        </div>
        <div class="settings-option">
            <label class="settings-label">Langue de traduction</label>
            <select class="settings-select" id="translate-lang-select">
                <option value="fr">Français</option>
                <option value="en">Anglais</option>
                <option value="es">Espagnol</option>
            </select>
        </div>
    </div>
    
    <div class="divider"></div>
    
    <div class="settings-group">
        <div class="settings-group-title">
            <i class="fas fa-bell"></i>
            <span>Notifications</span>
        </div>
        <div class="settings-option">
            <label class="settings-label">Activer les notifications</label>
            <label class="settings-switch">
                <input type="checkbox" id="notifications-toggle" checked>
                <span class="settings-slider"></span>
            </label>
        </div>
        <div class="settings-option">
            <label class="settings-label">Son des messages</label>
            <label class="settings-switch">
                <input type="checkbox" id="message-sound-toggle" checked>
                <span class="settings-slider"></span>
            </label>
        </div>
    </div>
</div>

<!-- Main Container -->
<div class="main-container">
    <!-- Sidebar -->
    <div class="chat-sidebar-container" id="sidebar">
        <div class="chat-sidebar">
            <h3><i class="fas fa-comments"></i> Conversations</h3>
            <div class="conversations-list" id="conversations-list">
                <!-- Conversations will be loaded here -->
            </div>
            <button class="btn btn-primary new-conversation-btn" id="new-conversation-btn">
                <i class="fas fa-plus"></i> Nouvelle conversation
            </button>
        </div>
    </div>

    <!-- Chat Main -->
    <div class="chat-main">
        <div class="chat-header">
            <div class="chat-header-content">
                <div class="chat-header-avatar">SM</div>
                <div class="chat-header-info">
                    <div class="chat-title" id="chat-title">Sélectionnez une conversation</div>
                    <div class="chat-status" id="chat-status">En ligne</div>
                </div>
            </div>
            <div class="chat-actions">
                <button class="chat-action-btn" id="call-btn">
                    <i class="fas fa-phone"></i>
                </button>
                <button class="chat-action-btn" id="video-btn">
                    <i class="fas fa-video"></i>
                </button>
                <button class="chat-action-btn" id="info-btn">
                    <i class="fas fa-info-circle"></i>
                </button>
            </div>
        </div>
        
        <div class="typing-indicator" id="typing-indicator">
            <i class="fas fa-pencil-alt"></i> Sarah est en train d'écrire...
        </div>
        
        <div class="messages-list" id="messages-list">
            <!-- Messages will be loaded here -->
        </div>
        
        <form class="message-form" id="message-form">
            <div class="message-input-container">
                <button type="button" class="emoji-btn" id="emoji-btn">
                    <i class="far fa-smile"></i>
                </button>
                <input type="text" id="message-input" placeholder="Écrire un message...">
                <div class="emoji-panel" id="emoji-panel">
                    <div class="emoji-grid">
                        <button type="button" class="emoji-item" data-emoji="😊">😊</button>
                        <button type="button" class="emoji-item" data-emoji="😂">😂</button>
                        <button type="button" class="emoji-item" data-emoji="❤️">❤️</button>
                        <button type="button" class="emoji-item" data-emoji="👍">👍</button>
                        <button type="button" class="emoji-item" data-emoji="👎">👎</button>
                        <button type="button" class="emoji-item" data-emoji="😢">😢</button>
                        <button type="button" class="emoji-item" data-emoji="😮">😮</button>
                        <button type="button" class="emoji-item" data-emoji="😡">😡</button>
                        <button type="button" class="emoji-item" data-emoji="🔥">🔥</button>
                        <button type="button" class="emoji-item" data-emoji="💯">💯</button>
                                                    <button type="button" class="emoji-item" data-emoji="🎉">🎉</button>
                        <button type="button" class="emoji-item" data-emoji="🤔">🤔</button>
                        <button type="button" class="emoji-item" data-emoji="👏">👏</button>
                        <button type="button" class="emoji-item" data-emoji="🙏">🙏</button>
                        <button type="button" class="emoji-item" data-emoji="😎">😎</button>
                        <button type="button" class="emoji-item" data-emoji="🥳">🥳</button>
                    </div>
                </div>
            </div>
            <button type="button" class="attachment-btn" id="attachment-btn">
                <i class="fas fa-paperclip"></i>
            </button>
            <button type="submit" class="send-btn" id="send-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>
</div>
