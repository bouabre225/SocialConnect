
<div class="container-flex">
    <div class="card">
        <div class="left-panel">
            <h2>Sécurité Renforcée</h2>
            <p>Protégez votre compte avec un nouveau mot de passe sécurisé</p>
            
            <div class="feature">
                <i class="bi bi-shield-check"></i>
                <span>Chiffrement avancé</span>
            </div>
            
            <div class="feature">
                <i class="bi bi-lock-fill"></i>
                <span>Mot de passe sécurisé</span>
            </div>
            
            <div class="feature">
                <i class="bi bi-key-fill"></i>
                <span>Accès protégé</span>
            </div>
            
            <div class="feature">
                <i class="bi bi-check-circle-fill"></i>
                <span>Validation instantanée</span>
            </div>
        </div>
        
        <div class="right-panel">
            <h3 class="mb-3 text-center">Réinitialiser mon mot de passe</h3>
            <div id="resetMessage"></div>
            <form id="resetForm">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" name="password" placeholder="Nouveau mot de passe" required>
                </div>
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" name="confirm_password" placeholder="Confirmer le mot de passe" required>
                </div>
                <button type="submit" class="btn btn-success w-100 mt-3">Réinitialiser</button>
            </form>
        </div>
    </div>
</div>
