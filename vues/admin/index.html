<div class="theme-switcher">
    <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="themeToggle">
        <label class="form-check-label" for="themeToggle">
            <i class="bi bi-moon-fill"></i> Mode sombre
        </label>
    </div>
</div>

<div class="language-selector">
    <button onclick="showLanguageSelector()" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-translate"></i> Langue
    </button>
    <div id="google_translate_element" style="display: none;"></div>
</div>

<div class="login-container">
    <div class="login-card row g-0 animate-fade">
        <div class="col-lg-5 left-panel">
            <div class="app-logo">
                <i class="bi bi-shield-lock"></i>
                <span>SocialConnect <span class="admin-badge">Admin</span></span>
            </div>
            <p>Panneau d'administration sécurisé</p>
            
            <div class="feature-item">
                <i class="bi bi-graph-up-arrow feature-icon"></i>
                <a data-url="#" style="color: inherit; text-decoration: none;"><span>Statistiques complètes</span></a>
            </div>
            
            <div class="feature-item">
                <i class="bi bi-people-fill feature-icon"></i>
                <a data-url="#" style="color: inherit; text-decoration: none;"><span>Gestion des utilisateurs</span></a>
            </div>
            
            <div class="feature-item">
                <i class="bi bi-gear-fill feature-icon"></i>
                <a data-url="#" style="color: inherit; text-decoration: none;"><span>Configuration avancée</span></a>
            </div>
        </div>

        <div class="col-lg-7 right-panel">
            <h3 class="form-title">Connexion Admin</h3>
            <div id="activationMessage"></div>
            <div id="loginMessage"></div>
            
            <form id="loginForm">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                    <input type="email" class="form-control" name="email" placeholder="Email administrateur" required>
                </div>
                
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="password" class="form-control password-field" name="password" placeholder="Mot de passe" required>
                    <button type="button" class="btn btn-outline-secondary toggle-password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Se souvenir de moi</label>
                    </div>
                    <a href="javascript:void(0);" data-url="/forgot" class="forgot-password text-decoration-none">Mot de passe oublié ?</a>
                </div>
                
                <button type="submit" class="btn btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    <span id="loginText">Accéder au dashboard</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
            </form>
            
            <div class="text-center mt-4">
                <p class="small">Retour au <a href="javascript:void(0);" data-url="/home" class="login-link text-decoration-none">site principal</a></p>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <p class="mb-0">&copy; 2025 SocialConnect Admin. 
            <a data-url="#" class="text-decoration-none">Confidentialité</a> · 
            <a data-url="#" class="text-decoration-none">Sécurité</a>
        </p>
    </div>
</footer>
