<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-light: #6b8cba;
            --primary-dark: #3a5784;
            --accent: #ff7e5f;
            --success: #28a745;
            --warning: #ffc107;
            --info: #17a2b8;
            --danger: #dc3545;
            --light: #ffffff;
            --dark: #2b2d42;
            --gray: #f8f9fa;
            --gray-dark: #e9ecef;
            --gray-light: #f1f3f4;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.15);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
            transition: var(--transition);
        }
    
        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(74, 111, 165, 0.3);
            transition: var(--transition);
            margin-bottom: 2rem;
        }
    
        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 111, 165, 0.4);
            color: white;
        }
    
        .dashboard-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 2.5rem 3rem;
        }
    
        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.1);
            border-radius: var(--border-radius);
            margin-bottom: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
    
        .dashboard-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
    
        .dashboard-header h1 {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
    
        .dashboard-header h1 i {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    
        .dashboard-header p {
            color: #6c757d;
            font-size: 1.1rem;
        }
    
        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(74, 111, 165, 0.3);
            transition: var(--transition);
            z-index: 1000;
        }
    
        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(74, 111, 165, 0.4);
        }
    
        .table-responsive {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            padding: 1.5rem;
        }
    
        .user-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
    
        .user-table th {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 1.4rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 1rem;
        }
    
        .user-table td {
            padding: 1.4rem;
            vertical-align: middle;
            border-bottom: 1px solid rgba(74, 111, 165, 0.1);
            transition: var(--transition);
        }
    
        .user-table tbody tr:hover {
            background: linear-gradient(90deg, rgba(74, 111, 165, 0.05), rgba(255, 126, 95, 0.02));
            transform: scale(1.005);
        }
    
        .badge, .user-status {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }
    
        .badge-date {
            background: linear-gradient(135deg, var(--info), #20c997);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
    
        .badge.bg-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)) !important; }
        .badge.bg-success { background: linear-gradient(135deg, var(--success), #20c997) !important; }
        .badge.bg-danger  { background: linear-gradient(135deg, var(--danger), #e74c3c) !important; }
        .badge.bg-warning { background: linear-gradient(135deg, var(--warning), #f39c12) !important; }
    
        .btn-action {
            border-radius: var(--border-radius);
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: var(--transition);
            border: none;
            position: relative;
            overflow: hidden;
            font-size: 0.85rem;
            color: white;
        }
    
        .btn-action::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition);
        }
    
        .btn-action:hover::before { left: 100%; }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
    
        .btn-delete  { background: linear-gradient(135deg, var(--danger), #e74c3c); }
        .btn-block   { background: linear-gradient(135deg, var(--warning), #f39c12); }
        .btn-ban     { background: linear-gradient(135deg, #6f42c1, #8b5cf6); }
    
        .btn-delete:hover  { box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4); }
        .btn-block:hover   { box-shadow: 0 6px 20px rgba(255, 193, 7, 0.4); }
        .btn-ban:hover     { box-shadow: 0 6px 20px rgba(111, 66, 193, 0.4); }
    
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
    
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    
        .empty-state h4 {
            margin-bottom: 1rem;
            font-weight: 600;
        }
    
        /* Mode sombre */
        body.dark-theme {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: var(--dark);
        }
    
        body.dark-theme .dashboard-header,
        body.dark-theme .table-responsive,
        body.dark-theme .modal-content {
            background: rgba(45, 45, 45, 0.95);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--dark);
        }
    
        body.dark-theme .user-table td {
            color: var(--dark);
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }
    
        body.dark-theme .user-table tbody tr:hover {
            background: linear-gradient(90deg, rgba(67, 97, 238, 0.1), rgba(76, 201, 240, 0.05));
        }
    
        body.dark-theme .empty-state {
            color: #aaa;
        }
    
        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-container {
                padding: 1rem;
            }
    
            .dashboard-header {
                padding: 2rem;
            }
    
            .theme-toggle {
                top: 1rem;
                right: 1rem;
            }
    
            .user-table th, .user-table td {
                padding: 0.8rem;
            }
    
            .btn-action {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
        }
    </style>
    
</head>
<body>
    <button class="theme-toggle" id="themeToggle">
        <i class="bi bi-moon-fill"></i>
    </button>

    <div class="text-center mt-4 animate__animated animate__fadeInUp">
        <a href="/vues/admin/dashboard-moderator.html" class="home-btn">
            <i class="bi bi-house-door"></i> Retourner à l'accueil

        </a>
    </div>

    <div class="dashboard-container animate__animated animate__fadeIn">
        <div class="dashboard-header animate__animated animate__fadeInDown">
            <h1><i class="bi bi-people-fill"></i> Gestion des Utilisateurs</h1>
            <p class="mb-0">Liste complète des utilisateurs enregistrés</p>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover user-table">
                <thead>
                    <tr>
                        <th><i class="bi bi-hash"></i> ID</th>
                        <th><i class="bi bi-person"></i> Nom</th>
                        <th><i class="bi bi-person"></i> Prénom</th>
                        <th><i class="bi bi-envelope"></i> Email</th>
                        <th><i class="bi bi-calendar"></i> Créé le</th>
                        <th><i class="bi bi-info-circle"></i> Statut</th>
                        <th><i class="bi bi-gear"></i> Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmationModalLabel">Confirmer l'action</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmationModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-danger" id="confirmActionBtn">Confirmer</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const themeIcon = themeToggle.querySelector('i');

        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-theme');
            themeIcon.className = 'bi bi-sun-fill';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            
            themeIcon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            themeToggle.style.transform = 'scale(0.8)';
            setTimeout(() => {
                themeToggle.style.transform = 'scale(1)';
            }, 150);
        });

        let users = [
            {
                id: 1,
                nom: "KORE",
                prenom: "Ange",
                email: "ange.kore@gmail.com",
                dateCreation: "2025-07-11",
                status: "actif"
            }
        ];

        function renderUsers() {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-5">
                            <div class="empty-state">
                                <i class="bi bi-people"></i>
                                <h4>Aucun utilisateur trouvé</h4>
                                <p>Les utilisateurs apparaîtront ici lorsqu'ils s'inscriront.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            users.forEach((user, index) => {
                const tr = document.createElement('tr');
                tr.className = `animate__animated animate__fadeInUp`;
                tr.style.animationDelay = `${index * 0.1}s`;
                
                let statusBadge = '';
                if (user.status === 'banned') {
                    statusBadge = '<span class="user-status status-banned">Banni</span>';
                } else if (user.status === 'blocked') {
                    statusBadge = '<span class="user-status status-blocked">Bloqué</span>';
                } else {
                    statusBadge = '<span class="user-status status-active">Actif</span>';
                }

                let actions = '';
                if (user.status === 'banned') {
                    actions = `
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-action btn-delete" onclick="deleteUser(${user.id}, '${user.prenom} ${user.nom}')">
                                <i class="bi bi-trash"></i> Supprimer
                            </button>
                        </div>
                    `;
                } else if (user.status === 'blocked') {
                    actions = `
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-action btn-delete" onclick="deleteUser(${user.id}, '${user.prenom} ${user.nom}')">
                                <i class="bi bi-trash"></i> Supprimer
                            </button>
                            <button class="btn btn-sm btn-action btn-success" onclick="unblockUser(${user.id}, '${user.prenom} ${user.nom}')">
                                <i class="bi bi-unlock"></i> Débloquer
                            </button>
                            <button class="btn btn-sm btn-action btn-ban" onclick="banUser(${user.id}, '${user.prenom} ${user.nom}')">
                                <i class="bi bi-ban"></i> Bannir
                            </button>
                        </div>
                    `;
                } else {
                    actions = `
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-action btn-delete" onclick="deleteUser(${user.id}, '${user.prenom} ${user.nom}')">
                                <i class="bi bi-trash"></i> Supprimer
                            </button>
                            <button class="btn btn-sm btn-action btn-block" onclick="blockUser(${user.id}, '${user.prenom} ${user.nom}')">
                                <i class="bi bi-lock"></i> Bloquer
                            </button>
                            <button class="btn btn-sm btn-action btn-ban" onclick="banUser(${user.id}, '${user.prenom} ${user.nom}')">
                                <i class="bi bi-ban"></i> Bannir
                            </button>
                        </div>
                    `;
                }

                tr.innerHTML = `
                    <td><span class="badge bg-primary">#${user.id}</span></td>
                    <td>${user.nom}</td>
                    <td>${user.prenom}</td>
                    <td>${user.email}</td>
                    <td><span class="badge-date">${user.dateCreation}</span></td>
                    <td>${statusBadge}</td>
                    <td>${actions}</td>
                `;
                
                tbody.appendChild(tr);
            });
        }

        let currentAction = null;
        let currentUserId = null;
        let currentUserName = null;
        function deleteUser(userId, userName) {
            currentAction = 'delete';
            currentUserId = userId;
            currentUserName = userName;
            
            document.getElementById('confirmationModalLabel').textContent = 'Confirmer la suppression';
            document.getElementById('confirmationModalBody').innerHTML = `
                <div class="text-center">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">Êtes-vous sûr de vouloir supprimer l'utilisateur ?</h5>
                    <p class="text-muted"><strong>${userName}</strong> (ID: ${userId})</p>
                    <div class="alert alert-warning">
                        <i class="bi bi-warning"></i> Cette action est irréversible !
                    </div>
                </div>
            `;
            document.getElementById('confirmActionBtn').className = 'btn btn-danger';
            document.getElementById('confirmActionBtn').innerHTML = '<i class="bi bi-trash"></i> Supprimer';
            
            new bootstrap.Modal(document.getElementById('confirmationModal')).show();
        }

        function blockUser(userId, userName) {
            currentAction = 'block';
            currentUserId = userId;
            currentUserName = userName;
            
            document.getElementById('confirmationModalLabel').textContent = 'Confirmer le blocage';
            document.getElementById('confirmationModalBody').innerHTML = `
                <div class="text-center">
                    <i class="bi bi-lock text-warning" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">Êtes-vous sûr de vouloir bloquer l'utilisateur ?</h5>
                    <p class="text-muted"><strong>${userName}</strong> (ID: ${userId})</p>
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i> L'utilisateur ne pourra plus se connecter temporairement.
                    </div>
                </div>
            `;
            document.getElementById('confirmActionBtn').className = 'btn btn-warning';
            document.getElementById('confirmActionBtn').innerHTML = '<i class="bi bi-lock"></i> Bloquer';
            
            new bootstrap.Modal(document.getElementById('confirmationModal')).show();
        }

        function banUser(userId, userName) {
            currentAction = 'ban';
            currentUserId = userId;
            currentUserName = userName;
            
            document.getElementById('confirmationModalLabel').textContent = 'Confirmer le bannissement';
            document.getElementById('confirmationModalBody').innerHTML = `
                <div class="text-center">
                    <i class="bi bi-ban text-danger" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">Êtes-vous sûr de vouloir bannir l'utilisateur ?</h5>
                    <p class="text-muted"><strong>${userName}</strong> (ID: ${userId})</p>
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> L'utilisateur sera définitivement banni de la plateforme !
                    </div>
                </div>
            `;
            document.getElementById('confirmActionBtn').className = 'btn btn-danger';
            document.getElementById('confirmActionBtn').innerHTML = '<i class="bi bi-ban"></i> Bannir';
            
            new bootstrap.Modal(document.getElementById('confirmationModal')).show();
        }

        function unblockUser(userId, userName) {
            currentAction = 'unblock';
            currentUserId = userId;
            currentUserName = userName;
            
            document.getElementById('confirmationModalLabel').textContent = 'Confirmer le déblocage';
            document.getElementById('confirmationModalBody').innerHTML = `
                <div class="text-center">
                    <i class="bi bi-unlock text-success" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">Êtes-vous sûr de vouloir débloquer l'utilisateur ?</h5>
                    <p class="text-muted"><strong>${userName}</strong> (ID: ${userId})</p>
                    <div class="alert alert-success">
                        <i class="bi bi-info-circle"></i> L'utilisateur pourra à nouveau se connecter.
                    </div>
                </div>
            `;
            document.getElementById('confirmActionBtn').className = 'btn btn-success';
            document.getElementById('confirmActionBtn').innerHTML = '<i class="bi bi-unlock"></i> Débloquer';
            
            new bootstrap.Modal(document.getElementById('confirmationModal')).show();
        }

        document.getElementById('confirmActionBtn').addEventListener('click', function() {
            if (currentAction && currentUserId) {
                executeAction(currentAction, currentUserId, currentUserName);
            }
        });

        function executeAction(action, userId, userName) {
            bootstrap.Modal.getInstance(document.getElementById('confirmationModal')).hide();
            
            let actionText = '';
            let actionClass = '';
            
            switch(action) {
                case 'delete':
                    actionText = 'supprimé';
                    actionClass = 'danger';
                    users = users.filter(user => user.id !== userId);
                    break;
                case 'block':
                    actionText = 'bloqué';
                    actionClass = 'warning';
                    users = users.map(user => {
                        if (user.id === userId) {
                            return {...user, status: 'blocked'};
                        }
                        return user;
                    });
                    break;
                case 'ban':
                    actionText = 'banni';
                    actionClass = 'danger';
                    users = users.map(user => {
                        if (user.id === userId) {
                            return {...user, status: 'banned'};
                        }
                        return user;
                    });
                    break;
                case 'unblock':
                    actionText = 'débloqué';
                    actionClass = 'success';
                    users = users.map(user => {
                        if (user.id === userId) {
                            return {...user, status: 'active'};
                        }
                        return user;
                    });
                    break;
            }
            
            showNotification(`L'utilisateur ${userName} a été ${actionText} avec succès.`, actionClass);
            renderUsers();
            
            currentAction = null;
            currentUserId = null;
            currentUserName = null;
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            notification.style.cssText = `
                top: 20px;
                right: 20px;
                z-index: 9999;
                min-width: 300px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
                border-radius: 16px;
                backdrop-filter: blur(10px);
            `;
            
            notification.innerHTML = `
                <div class="d-flex align-items-center">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span>${message}</span>
                    <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        notification.remove();
                    }, 150);
                }
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderUsers();
            
            document.querySelectorAll('.btn-action').forEach(btn => {
                btn.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-2px) scale(1.05)';
                });
                
                btn.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
        });

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                themeToggle.click();
            }
        });
    </script>
</body>
</html>
