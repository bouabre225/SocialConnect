<button class="theme-toggle" id="themeToggle">
    <i class="bi bi-moon-fill"></i>
</button>

<div class="text-center mt-4 animate__animated animate__fadeInUp">
<a data-url="/moderator" class="home-btn">
    <i class="bi bi-house-door"></i> Retourner à l'accueil
    </a>
</div>

<div class="dashboard-container animate__animated animate__fadeIn">
    <div class="dashboard-header animate__animated animate__fadeInDown">
        <h1><i class="bi bi-people-fill"></i> Gestion des Utilisateurs</h1>
        <p class="mb-0">Liste complète des utilisateurs enregistrés</p>
    </div>
    
    <div class="table-responsive">
        <table class="table table-hover user-table">
            <thead>
                <tr>
                    <th><i class="bi bi-hash"></i> ID</th>
                    <th><i class="bi bi-person"></i> Nom</th>
                    <th><i class="bi bi-person"></i> Prénom</th>
                    <th><i class="bi bi-envelope"></i> Email</th>
                    <th><i class="bi bi-calendar"></i> Créé le</th>
                    <th><i class="bi bi-gear"></i> Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr class="animate__animated animate__fadeIn">
                    <td><span class="badge bg-primary">#1</span></td>
                    <td></td>
                    <td></td>
                    <td></td>   
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-action btn-delete" onclick="deleteUser(1, 'Jean Dupont')">
                            <i class="bi bi-trash"></i> Supprimer
                        </button>
                        <button class="btn btn-sm btn-action btn-block" onclick="blockUser(1, 'Jean Dupont')">
                            <i class="bi bi-lock"></i> Bloquer
                        </button>
                        <button class="btn btn-sm btn-action btn-ban" onclick="banUser(1, 'Jean Dupont')">
                            <i class="bi bi-ban"></i> Bannir
                        </button>
                    </div>                    
                </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmationModalLabel">Confirmer l'action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="confirmationModalBody">
                
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-danger" id="confirmActionBtn">Confirmer</button>
            </div>
        </div>
    </div>
</div>
