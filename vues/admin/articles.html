<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Articles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4a6fa5;
            --primary-light: #6b8cba;
            --primary-dark: #3a5784;
            --accent: #ff7e5f;
            --success: #28a745;
            --warning: #ffc107;
            --info: #17a2b8;
            --danger: #dc3545;
            --light: #ffffff;
            --dark: #2b2d42;
            --gray: #f8f9fa;
            --gray-dark: #e9ecef;
            --gray-light: #f1f3f4;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.15);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
            transition: var(--transition);
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(74, 111, 165, 0.3);
            transition: var(--transition);
            margin-bottom: 2rem;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 111, 165, 0.4);
            color: white;
        }

        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--success), #20c997);
            color: white;
            text-decoration: none;
            border-radius: var(--border-radius);
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            transition: var(--transition);
            margin-bottom: 2rem;
            border: none;
            cursor: pointer;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
            color: white;
        }

        .dashboard-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 2.5rem 3rem;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.1);
            border-radius: var(--border-radius);
            margin-bottom: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .dashboard-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .dashboard-header h1 {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }

        .dashboard-header h1 i {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .dashboard-header p {
            color: #6c757d;
            font-size: 1.1rem;
        }

        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(74, 111, 165, 0.3);
            transition: var(--transition);
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(74, 111, 165, 0.4);
        }

        .table-responsive {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            padding: 1.5rem;
        }

        .articles-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .articles-table th {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 1.4rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 1rem;
        }

        .articles-table td {
            padding: 1.4rem;
            vertical-align: middle;
            border-bottom: 1px solid rgba(74, 111, 165, 0.1);
            transition: var(--transition);
        }

        .articles-table tbody tr:hover {
            background: linear-gradient(90deg, rgba(74, 111, 165, 0.05), rgba(255, 126, 95, 0.02));
            transform: scale(1.005);
        }

        .badge, .article-status {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .badge-date {
            background: linear-gradient(135deg, var(--info), #20c997);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .badge.bg-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)) !important; }
        .badge.bg-success { background: linear-gradient(135deg, var(--success), #20c997) !important; }
        .badge.bg-danger  { background: linear-gradient(135deg, var(--danger), #e74c3c) !important; }
        .badge.bg-warning { background: linear-gradient(135deg, var(--warning), #f39c12) !important; }

        .status-published { background: linear-gradient(135deg, var(--success), #20c997); color: white; }
        .status-draft { background: linear-gradient(135deg, var(--warning), #f39c12); color: white; }
        .status-archived { background: linear-gradient(135deg, #6c757d, #495057); color: white; }

        .btn-action {
            border-radius: var(--border-radius);
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: var(--transition);
            border: none;
            position: relative;
            overflow: hidden;
            font-size: 0.85rem;
            color: white;
        }

        .btn-action::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: var(--transition);
        }

        .btn-action:hover::before { left: 100%; }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-delete  { background: linear-gradient(135deg, var(--danger), #e74c3c); }
        .btn-edit    { background: linear-gradient(135deg, var(--primary), var(--primary-light)); }
        .btn-archive { background: linear-gradient(135deg, #6c757d, #495057); }
        .btn-publish { background: linear-gradient(135deg, var(--success), #20c997); }

        .btn-delete:hover  { box-shadow: 0 6px 20px rgba(220, 53, 69, 0.4); }
        .btn-edit:hover    { box-shadow: 0 6px 20px rgba(74, 111, 165, 0.4); }
        .btn-archive:hover { box-shadow: 0 6px 20px rgba(108, 117, 125, 0.4); }
        .btn-publish:hover { box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4); }

        .article-title {
            font-weight: 600;
            color: var(--dark);
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .article-excerpt {
            color: #6c757d;
            font-size: 0.9rem;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h4 {
            margin-bottom: 1rem;
            font-weight: 600;
        }

        /* Mode sombre */
        body.dark-theme {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: var(--light);
        }

        body.dark-theme .dashboard-header,
        body.dark-theme .table-responsive,
        body.dark-theme .modal-content {
            background: rgba(45, 45, 45, 0.95);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--light);
        }

        body.dark-theme .articles-table td {
            color: var(--light);
            border-bottom-color: rgba(255, 255, 255, 0.1);
        }

        body.dark-theme .articles-table tbody tr:hover {
            background: linear-gradient(90deg, rgba(67, 97, 238, 0.1), rgba(76, 201, 240, 0.05));
        }

        body.dark-theme .empty-state {
            color: #aaa;
        }

        body.dark-theme .article-title {
            color: var(--light);
        }

        body.dark-theme .modal-header,
        body.dark-theme .modal-body,
        body.dark-theme .modal-footer {
            background: rgba(45, 45, 45, 0.95);
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Modal d'ajout d'article */
        .modal-content {
            border-radius: var(--border-radius);
            border: none;
            box-shadow: var(--shadow-hover);
        }

        .form-control, .form-select {
            border-radius: var(--border-radius);
            border: 2px solid rgba(74, 111, 165, 0.1);
            padding: 0.75rem 1rem;
            transition: var(--transition);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(74, 111, 165, 0.25);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-container {
                padding: 1rem;
            }

            .dashboard-header {
                padding: 2rem;
            }

            .theme-toggle {
                top: 1rem;
                right: 1rem;
            }

            .articles-table th, .articles-table td {
                padding: 0.8rem;
            }

            .btn-action {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }

            .article-title, .article-excerpt {
                max-width: 150px;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">
        <i class="bi bi-moon-fill"></i>
    </button>

    <div class="text-center mt-4 animate__animated animate__fadeInUp">
        <a href="/vues/admin/dashboard-moderator.html" class="home-btn">
            <i class="bi bi-house-door"></i> Retourner à l'accueil
        </a>
    </div>

    <div class="dashboard-container animate__animated animate__fadeIn">
        <div class="dashboard-header animate__animated animate__fadeInDown">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1><i class="bi bi-file-earmark-text-fill"></i> Gestion des Articles</h1>
                    <p class="mb-0">Gérez les articles et publications des utilisateurs</p>
                </div>
                <button class="add-btn" onclick="openAddArticleModal()">
                    <i class="bi bi-plus-circle"></i> Nouvel Article
                </button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover articles-table">
                <thead>
                    <tr>
                        <th><i class="bi bi-hash"></i> ID</th>
                        <th><i class="bi bi-file-text"></i> Titre</th>
                        <th><i class="bi bi-card-text"></i> Extrait</th>
                        <th><i class="bi bi-person"></i> Auteur</th>
                        <th><i class="bi bi-calendar"></i> Date</th>
                        <th><i class="bi bi-info-circle"></i> Statut</th>
                        <th><i class="bi bi-gear"></i> Actions</th>
                    </tr>
                </thead>
                <tbody id="articlesTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmationModalLabel">Confirmer l'action</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmationModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-danger" id="confirmActionBtn">Confirmer</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addArticleModal" tabindex="-1" aria-labelledby="addArticleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addArticleModalLabel">
                        <i class="bi bi-plus-circle"></i> Nouvel Article
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addArticleForm">
                        <div class="mb-3">
                            <label for="articleTitle" class="form-label">Titre de l'article</label>
                            <input type="text" class="form-control" id="articleTitle" placeholder="Saisissez le titre..." required>
                        </div>
                        <div class="mb-3">
                            <label for="articleExcerpt" class="form-label">Extrait</label>
                            <textarea class="form-control" id="articleExcerpt" rows="3" placeholder="Bref résumé de l'article..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="articleAuthor" class="form-label">Auteur</label>
                            <input type="text" class="form-control" id="articleAuthor" placeholder="Nom de l'auteur..." required>
                        </div>
                        <div class="mb-3">
                            <label for="articleStatus" class="form-label">Statut</label>
                            <select class="form-select" id="articleStatus" required>
                                <option value="">Choisir un statut</option>
                                <option value="draft">Brouillon</option>
                                <option value="published">Publié</option>
                                <option value="archived">Archivé</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="articleContent" class="form-label">Contenu</label>
                            <textarea class="form-control" id="articleContent" rows="5" placeholder="Contenu de l'article..." required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-success" onclick="addArticle()">
                        <i class="bi bi-plus-circle"></i> Ajouter l'article
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const themeIcon = themeToggle.querySelector('i');
    
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            body.classList.add('dark-theme');
            themeIcon.className = 'bi bi-sun-fill';
        }
    
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            themeIcon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
    
            themeToggle.style.transform = 'scale(0.8)';
            setTimeout(() => {
                themeToggle.style.transform = 'scale(1)';
            }, 150);
        });
    
        let articles = [
            {
                id: 1,
                title: "Introduction à l'Intelligence Artificielle",
                excerpt: "Découvrez les bases de l'IA et son impact sur notre société moderne.",
                author: "Ange KORE",
                date: "2025-07-11",
                status: "published",
                content: "L'intelligence artificielle représente l'une des avancées technologiques les plus significatives de notre époque..."
            },
        ];
    
        let nextId = 5;
        let currentAction = null;
        let currentArticleId = null;
        let currentArticleTitle = null;
    
        function renderArticles() {
            const tbody = document.getElementById('articlesTableBody');
            tbody.innerHTML = '';
    
            if (articles.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-5">
                            <div class="empty-state">
                                <i class="bi bi-file-earmark-text"></i>
                                <h4>Aucun article trouvé</h4>
                                <p>Commencez par créer votre premier article.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }
    
            articles.forEach((article, index) => {
                const tr = document.createElement('tr');
                tr.className = `animate__animated animate__fadeInUp`;
                tr.style.animationDelay = `${index * 0.1}s`;
    
                let statusBadge = '';
                switch (article.status) {
                    case 'published':
                        statusBadge = '<span class="article-status status-published">Publié</span>';
                        break;
                    case 'draft':
                        statusBadge = '<span class="article-status status-draft">Brouillon</span>';
                        break;
                    case 'archived':
                        statusBadge = '<span class="article-status status-archived">Archivié</span>';
                        break;
                }
    
                let actions = '';
                if (article.status === 'archived') {
                    actions = `
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-action btn-delete" onclick="deleteArticle(${article.id}, '${article.title}')">
                                <i class="bi bi-trash"></i>
                            </button>
                            <button class="btn btn-sm btn-action btn-publish" onclick="publishArticle(${article.id}, '${article.title}')">
                                <i class="bi bi-arrow-up-circle"></i>
                            </button>
                        </div>
                    `;
                } else {
                    actions = `
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-action btn-edit" onclick="editArticle(${article.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-action btn-delete" onclick="deleteArticle(${article.id}, '${article.title}')">
                                <i class="bi bi-trash"></i>
                            </button>
                            <button class="btn btn-sm btn-action btn-archive" onclick="archiveArticle(${article.id}, '${article.title}')">
                                <i class="bi bi-archive"></i>
                            </button>
                        </div>
                    `;
                }
    
                tr.innerHTML = `
                    <td><span class="badge bg-primary">#${article.id}</span></td>
                    <td><div class="article-title" title="${article.title}">${article.title}</div></td>
                    <td><div class="article-excerpt" title="${article.excerpt}">${article.excerpt}</div></td>
                    <td>${article.author}</td>
                    <td><span class="badge-date">${article.date}</span></td>
                    <td>${statusBadge}</td>
                    <td>${actions}</td>
                `;
    
                tbody.appendChild(tr);
            });
        }
    
        function openAddArticleModal() {
            document.getElementById('addArticleForm').reset();
            document.querySelector('#addArticleModal .modal-title').innerHTML = `<i class="bi bi-plus-circle"></i> Nouvel Article`;
            const btn = document.querySelector('#addArticleModal .btn-success');
            btn.innerHTML = `<i class="bi bi-plus-circle"></i> Ajouter l'article`;
            btn.onclick = addArticle;
            new bootstrap.Modal(document.getElementById('addArticleModal')).show();
        }
    
        function addArticle() {
            const title = document.getElementById('articleTitle').value;
            const excerpt = document.getElementById('articleExcerpt').value;
            const author = document.getElementById('articleAuthor').value;
            const status = document.getElementById('articleStatus').value;
            const content = document.getElementById('articleContent').value;
    
            if (!title || !excerpt || !author || !status || !content) {
                alert('Veuillez remplir tous les champs.');
                return;
            }
    
            articles.unshift({
                id: nextId++,
                title,
                excerpt,
                author,
                date: new Date().toISOString().split('T')[0],
                status,
                content
            });
    
            bootstrap.Modal.getInstance(document.getElementById('addArticleModal')).hide();
            showNotification(`L'article "${title}" a été ajouté avec succès.`, 'success');
            renderArticles();
        }
    
        function deleteArticle(id, title) {
            currentAction = 'delete';
            currentArticleId = id;
            currentArticleTitle = title;
            openConfirmationModal('Supprimer', 'danger', `Êtes-vous sûr de vouloir supprimer l’article <strong>${title}</strong> ?`, 'trash');
        }
    
        function archiveArticle(id, title) {
            currentAction = 'archive';
            currentArticleId = id;
            currentArticleTitle = title;
            openConfirmationModal('Archiver', 'warning', `Voulez-vous archiver l’article <strong>${title}</strong> ?`, 'archive');
        }
    
        function publishArticle(id, title) {
            currentAction = 'publish';
            currentArticleId = id;
            currentArticleTitle = title;
            openConfirmationModal('Publier', 'success', `Publier maintenant l’article <strong>${title}</strong> ?`, 'arrow-up-circle');
        }
    
        function openConfirmationModal(actionText, btnClass, message, icon) {
            document.getElementById('confirmationModalLabel').textContent = `Confirmer ${actionText.toLowerCase()}`;
            document.getElementById('confirmationModalBody').innerHTML = `
                <div class="text-center">
                    <i class="bi bi-${icon} text-${btnClass}" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">${message}</h5>
                </div>
            `;
            const confirmBtn = document.getElementById('confirmActionBtn');
            confirmBtn.className = `btn btn-${btnClass}`;
            confirmBtn.innerHTML = `<i class="bi bi-${icon}"></i> ${actionText}`;
            confirmBtn.onclick = confirmAction;
            new bootstrap.Modal(document.getElementById('confirmationModal')).show();
        }
    
        function confirmAction() {
            if (currentAction === 'delete') {
                articles = articles.filter(a => a.id !== currentArticleId);
                showNotification(`L'article "${currentArticleTitle}" a été supprimé.`, 'danger');
            } else if (currentAction === 'archive') {
                const article = articles.find(a => a.id === currentArticleId);
                if (article) article.status = 'archived';
                showNotification(`L'article "${currentArticleTitle}" a été archivé.`, 'warning');
            } else if (currentAction === 'publish') {
                const article = articles.find(a => a.id === currentArticleId);
                if (article) article.status = 'published';
                showNotification(`L'article "${currentArticleTitle}" a été publié.`, 'success');
            }
    
            bootstrap.Modal.getInstance(document.getElementById('confirmationModal')).hide();
            renderArticles();
        }
    
        function editArticle(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;
    
            document.getElementById('articleTitle').value = article.title;
            document.getElementById('articleExcerpt').value = article.excerpt;
            document.getElementById('articleAuthor').value = article.author;
            document.getElementById('articleStatus').value = article.status;
            document.getElementById('articleContent').value = article.content;
    
            document.querySelector('#addArticleModal .modal-title').innerHTML = `<i class="bi bi-pencil"></i> Modifier l'Article`;
            const btn = document.querySelector('#addArticleModal .btn-success');
            btn.innerHTML = `<i class="bi bi-save"></i> Sauvegarder`;
            btn.onclick = () => saveEditedArticle(id);
    
            new bootstrap.Modal(document.getElementById('addArticleModal')).show();
        }
    
        function saveEditedArticle(id) {
            const article = articles.find(a => a.id === id);
            if (!article) return;
    
            article.title = document.getElementById('articleTitle').value;
            article.excerpt = document.getElementById('articleExcerpt').value;
            article.author = document.getElementById('articleAuthor').value;
            article.status = document.getElementById('articleStatus').value;
            article.content = document.getElementById('articleContent').value;
    
            bootstrap.Modal.getInstance(document.getElementById('addArticleModal')).hide();
            showNotification(`L'article "${article.title}" a été modifié.`, 'info');
    
            renderArticles();
        }
    
        function showNotification(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed top-0 end-0 m-4 animate__animated animate__fadeInRight`;
            alertDiv.style.zIndex = 2000;
            alertDiv.innerHTML = `
                <strong>${message}</strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
            `;
            document.body.appendChild(alertDiv);
    
            setTimeout(() => {
                alertDiv.classList.remove('show');
                alertDiv.classList.add('animate__fadeOutRight');
                setTimeout(() => {
                    alertDiv.remove();
                }, 500);
            }, 3500);
        }
    
        document.addEventListener('DOMContentLoaded', renderArticles);
    </script>
    
</body>
</html>
